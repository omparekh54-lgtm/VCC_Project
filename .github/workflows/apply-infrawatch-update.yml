name: Apply Infra Watchdog update

on:
  push:
    branches:
      - chatgpt/infrawatch-update

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/infrawatch-update
          fetch-depth: 0

      - name: Apply tested source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .update_payload/part* | base64 -d > /tmp/infrawatch-update.tar.gz
          tar -tzf /tmp/infrawatch-update.tar.gz >/dev/null
          tar -xzf /tmp/infrawatch-update.tar.gz
          rm -f ml/requirements.txt
          rm -rf .update_payload
          rm -f .github/workflows/apply-infrawatch-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply tested Infra Watchdog update"
          git push origin HEAD:chatgpt/infrawatch-update
