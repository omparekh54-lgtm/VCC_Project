name: Ideal design upgrade CI

on:
  push:
    branches: [ideal-design-upgrade]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.2 scikit-learn==1.2.2 joblib==1.4.2 boto3==1.34.162 fastapi==0.115.0 psutil==6.0.0 'anyio>=3.6,<5'
      - name: Compile Python sources
        run: |
          python -m py_compile backend/app.py lambda/*.py ml/*.py scripts/*.py
      - name: Smoke-test ideal model training
        run: |
          python - <<'PY'
          import csv, math, os
          os.makedirs('/tmp/iw', exist_ok=True)
          with open('/tmp/iw/cycle1.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['timestamp','cpu_usage','active_connections','lag_ms','response_time_ms','instance_count'])
              for i in range(260):
                  phase=(i%130)/130
                  load=1+18*phase
                  latency=80+max(0,phase-.55)*1800+40*math.sin(i/7)
                  w.writerow([i,15+65*phase,load,2+25*phase,latency,1])
          with open('/tmp/iw/cycle2.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['timestamp','cpu_usage','active_connections','lag_ms','response_time_ms','instance_count'])
              for i in range(260,520):
                  phase=((i-260)%130)/130
                  load=1+20*phase
                  latency=75+max(0,phase-.50)*2000+35*math.sin(i/8)
                  w.writerow([i,12+70*phase,load,1+30*phase,latency,1])
          PY
          python ml/train_ideal.py --train /tmp/iw --model-dir /tmp/model --min-baseline-improvement 0
          test -f /tmp/model/model.joblib
          test -f /tmp/model/model_meta.json
