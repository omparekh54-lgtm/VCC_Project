AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Infra Watchdog - persistent infrastructure (S3 data store, EC2 Auto Scaling
  group running the FastAPI app, and the Lambda scaling guardrail on an
  EventBridge schedule). SageMaker training/endpoint resources are created
  separately via ml/launch_training_job.py and ml/deploy_endpoint.py, since
  they depend on a model artifact that doesn't exist yet at infra-deploy time.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch the app instance(s) into (your default VPC works fine).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnet(s) in that VPC (the instance needs a public IP).
  InstanceType:
    Type: String
    Default: t3.medium
  MaxCapacity:
    Type: Number
    Default: 4
    Description: Ceiling the scaling guardrail is allowed to scale the app fleet to.
  LatencyThresholdMs:
    Type: Number
    Default: 500
    Description: Predicted response_time_ms above which the Lambda scales out.
  SageMakerEndpointName:
    Type: String
    Default: infra-watchdog-endpoint
    Description: Name you will give the SageMaker endpoint in ml/deploy_endpoint.py.
  AppPort:
    Type: Number
    Default: 8000

Resources:
  # ---------------------------------------------------------------------
  # S3 - training-data / model-artifact store, and where the app code lives
  # ---------------------------------------------------------------------
  MetricsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "infra-watchdog-metrics-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------
  # EC2 - runs the FastAPI app, in an Auto Scaling group so the Lambda has
  # something to scale. No load balancer (kept to exactly 4 AWS services),
  # so the Lambda discovers the live instance itself via the ASG + EC2 APIs.
  # ---------------------------------------------------------------------
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore # lets you connect via Session Manager, no SSH key needed
      Policies:
        - PolicyName: MetricsBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "arn:aws:s3:::${MetricsBucket}/app/*"
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "arn:aws:s3:::${MetricsBucket}/data/*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EC2InstanceRole]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Infra Watchdog app - inbound app port only, no SSH (use SSM)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIp: 0.0.0.0/0
          Description: >-
            Open for the demo so Locust and the Lambda (which runs outside
            this VPC) can both reach /metrics. For production, run the Lambda
            inside this VPC and restrict this to its security group instead.

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: infra-watchdog-app
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        IamInstanceProfile:
          Name: !Ref EC2InstanceProfile
        SecurityGroupIds: [!Ref AppSecurityGroup]
        UserData:
          Fn::Base64:
            !Sub |
              #!/bin/bash
              set -euo pipefail
              (dnf install -y python3-pip awscli || yum install -y python3-pip awscli)

              mkdir -p /opt/infra-watchdog
              cd /opt/infra-watchdog
              aws s3 cp s3://${MetricsBucket}/app/app.py .
              aws s3 cp s3://${MetricsBucket}/app/requirements.txt .
              pip3 install -r requirements.txt

              cat > /etc/systemd/system/infra-watchdog.service << 'EOF'
              [Unit]
              Description=Infra Watchdog FastAPI backend
              After=network.target

              [Service]
              WorkingDirectory=/opt/infra-watchdog
              ExecStart=/usr/local/bin/uvicorn app:app --host 0.0.0.0 --port ${AppPort}
              Restart=always
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
              EOF

              systemctl daemon-reload
              systemctl enable --now infra-watchdog.service

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: infra-watchdog-app-asg
      MinSize: "0"
      MaxSize: !Ref MaxCapacity
      DesiredCapacity: "0" # stays 0 until you've uploaded app.py to the bucket - see README
      VPCZoneIdentifier: !Ref SubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: infra-watchdog-app
          PropagateAtLaunch: true

  # ---------------------------------------------------------------------
  # SageMaker execution role (the endpoint/training job itself is created
  # later by ml/launch_training_job.py and ml/deploy_endpoint.py)
  # ---------------------------------------------------------------------
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sagemaker.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: MetricsBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:aws:s3:::${MetricsBucket}"
                  - !Sub "arn:aws:s3:::${MetricsBucket}/*"

  # ---------------------------------------------------------------------
  # Lambda - the scaling guardrail
  # ---------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScalingGuardrailPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sagemaker:InvokeEndpoint
                Resource: !Sub "arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/*"
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:SetDesiredCapacity
                  - ec2:DescribeInstances
                  - cloudwatch:PutMetricData
                Resource: "*" # these actions don't support resource-level restriction

  ScalingGuardrailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: infra-watchdog-scaling-guardrail
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Timeout: 55
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName
          ASG_NAME: !Ref AutoScalingGroup
          APP_PORT: !Ref AppPort
          LATENCY_THRESHOLD_MS: !Ref LatencyThresholdMs
          MAX_SCALE_STEP: "1"
      Code:
        # Inlined here so the stack is deployable in one shot (no external
        # deps beyond boto3, which ships with the Lambda runtime). This is a
        # mirror of lambda/lambda_function.py - that file is the source of
        # truth; if you change the logic, update it there and paste it back
        # in here (or switch to `aws lambda update-function-code` with a
        # zipped package once you're iterating on it directly).
        ZipFile: |
          import json
          import os
          import time
          import urllib.request

          import boto3

          SAGEMAKER_ENDPOINT_NAME = os.environ["SAGEMAKER_ENDPOINT_NAME"]
          ASG_NAME = os.environ["ASG_NAME"]
          APP_PORT = os.environ.get("APP_PORT", "8000")
          LATENCY_THRESHOLD_MS = float(os.environ.get("LATENCY_THRESHOLD_MS", "500"))
          MAX_SCALE_STEP = int(os.environ.get("MAX_SCALE_STEP", "1"))

          sagemaker_runtime = boto3.client("sagemaker-runtime")
          autoscaling = boto3.client("autoscaling")
          ec2 = boto3.client("ec2")
          cloudwatch = boto3.client("cloudwatch")


          def get_app_instance_ip():
              asg = autoscaling.describe_auto_scaling_groups(AutoScalingGroupNames=[ASG_NAME])["AutoScalingGroups"][0]
              instance_ids = [i["InstanceId"] for i in asg["Instances"] if i["LifecycleState"] == "InService"]
              if not instance_ids:
                  raise RuntimeError(f"No InService instances in ASG {ASG_NAME}")
              reservations = ec2.describe_instances(InstanceIds=instance_ids[:1])["Reservations"]
              ip = reservations[0]["Instances"][0].get("PublicIpAddress")
              if not ip:
                  raise RuntimeError("App instance has no public IP yet (still booting?)")
              return ip


          def fetch_metrics():
              ip = get_app_instance_ip()
              with urllib.request.urlopen(f"http://{ip}:{APP_PORT}/metrics", timeout=5) as resp:
                  return json.loads(resp.read().decode())


          def predict_latency(metrics):
              payload = json.dumps({k: metrics[k] for k in ("cpu_usage", "active_connections", "lag_ms")})
              response = sagemaker_runtime.invoke_endpoint(
                  EndpointName=SAGEMAKER_ENDPOINT_NAME, ContentType="application/json", Body=payload
              )
              result = json.loads(response["Body"].read().decode())
              return result["predicted_response_time_ms"][0]


          def maybe_scale_out(predicted_latency_ms):
              cloudwatch.put_metric_data(
                  Namespace="InfraWatchdog",
                  MetricData=[{"MetricName": "PredictedLatencyMs", "Value": predicted_latency_ms, "Unit": "Milliseconds"}],
              )
              if predicted_latency_ms <= LATENCY_THRESHOLD_MS:
                  return "ok"
              group = autoscaling.describe_auto_scaling_groups(AutoScalingGroupNames=[ASG_NAME])["AutoScalingGroups"][0]
              current, max_cap = group["DesiredCapacity"], group["MaxSize"]
              new_capacity = min(current + MAX_SCALE_STEP, max_cap)
              if new_capacity > current:
                  autoscaling.set_desired_capacity(AutoScalingGroupName=ASG_NAME, DesiredCapacity=new_capacity, HonorCooldown=True)
                  return f"scaled {current} -> {new_capacity}"
              return "already at max capacity"


          def run_check():
              metrics = fetch_metrics()
              predicted = predict_latency(metrics)
              outcome = maybe_scale_out(predicted)
              print(f"metrics={metrics} predicted_latency_ms={predicted:.1f} outcome={outcome}")
              return predicted, outcome


          def lambda_handler(event, context):
              results = [run_check()]
              time.sleep(30)
              results.append(run_check())
              return {"checks": [{"predicted_latency_ms": p, "outcome": o} for p, o in results]}

  SchedulerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: infra-watchdog-schedule
      Description: Invokes the scaling guardrail roughly once a minute (see lambda cadence note)
      ScheduleExpression: rate(1 minute)
      State: DISABLED # enable once the app, model, and endpoint are all live - see README
      Targets:
        - Arn: !GetAtt ScalingGuardrailFunction.Arn
          Id: ScalingGuardrailTarget

  SchedulerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScalingGuardrailFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SchedulerRule.Arn

Outputs:
  MetricsBucketName:
    Value: !Ref MetricsBucket
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  SageMakerExecutionRoleArn:
    Value: !GetAtt SageMakerExecutionRole.Arn
  ScalingGuardrailFunctionName:
    Value: !Ref ScalingGuardrailFunction
  SchedulerRuleName:
    Value: !Ref SchedulerRule
